<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Cast Mirror</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  /* Shown pixel for pixel (the main script sets its size from the picture): any stretch blurs text. It only
     shrinks, to fit, if the view got smaller than the picture. */
  /* The area clear of the notch or island and the rounded corners; the Mac sends exactly its size. */
  #area {
    position: fixed;
    inset: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  canvas {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
  }
  #msg {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 24px;
    color: #f5f5f7;
    font: 18px -apple-system, BlinkMacSystemFont, sans-serif;
    white-space: pre-line;
  }
  #msg.hidden { display: none; }
  #full {
    position: fixed;
    top: max(12px, env(safe-area-inset-top));
    right: max(12px, env(safe-area-inset-right));
    width: 44px;
    height: 44px;
    border: none;
    border-radius: 22px;
    background: rgba(0, 0, 0, 0.55);
    color: #fff;
    font-size: 22px;
    line-height: 44px;
    transition: opacity 0.3s;
  }
  #full.idle { opacity: 0; pointer-events: none; }
</style>
</head>
<body>
<div id="area"><canvas id="screen"></canvas></div>
<div id="msg">Connecting…</div>
<button id="full" aria-label="Fullscreen">⛶</button>

<!-- Decoding and drawing run in a worker, away from the main thread's other work. Frames reach it from
     the main thread, which owns the connections (WebRTC isn't available in workers). -->
<script id="worker" type="text/plain">
  // Frames: flags u8 (bit0 key) | frame u32 | timestamp µs u64 | piece u16 | pieces u16 | H.264 Annex B.
  // Big frames come in pieces (data channel messages are limited to 256 KB). Over the data channel they
  // can arrive out of order or not at all (it gives up after 100 ms of retries).
  const HEADER = 17;
  // Frame id → its pieces so far.
  const partial = new Map();
  const LOST_AFTER_MS = 120;
  let canvas, ctx, decoder;
  let configured = false;
  let expected = null;
  const pending = new Map();
  let gapSince = 0;
  let shown = false;
  const stats = {decoded: 0, lost: 0, flushed: 0, maxQueue: 0, decodeMs: 0, errors: 0};
  const queued = new Map();

  const up = (text) => postMessage({up: text});
  const isKey = (buffer) => (new Uint8Array(buffer, 0, 1)[0] & 1) === 1;

  // "avc1.PPCCLL" from the SPS (NAL type 7) the key frame starts with.
  function codecOf(data) {
    for (let i = 0; i + 4 < data.length; i++) {
      if (data[i] === 0 && data[i + 1] === 0 && data[i + 2] === 1 && (data[i + 3] & 0x1f) === 7) {
        const hex = (b) => b.toString(16).padStart(2, "0");
        return "avc1." + hex(data[i + 4]) + hex(data[i + 5]) + hex(data[i + 6]);
      }
    }
    return "avc1.4d0028";
  }

  function newDecoder() {
    configured = false;
    decoder = new VideoDecoder({
      output(frame) {
        if (canvas.width !== frame.displayWidth || canvas.height !== frame.displayHeight) {
          canvas.width = frame.displayWidth;
          canvas.height = frame.displayHeight;
          postMessage({size: [canvas.width, canvas.height]});
        }
        ctx.drawImage(frame, 0, 0);
        const start = queued.get(frame.timestamp);
        if (start !== undefined) {
          stats.decodeMs = Math.max(stats.decodeMs, performance.now() - start);
          queued.delete(frame.timestamp);
        }
        stats.decoded++;
        if (!shown) {
          shown = true;
          postMessage({status: ""});
        }
        frame.close();
      },
      error() {
        stats.errors++;
        // A closed decoder can't be reused: start over from the next key frame.
        newDecoder();
        restart();
      },
    });
  }

  // Wait for the next key frame and ask the Mac for one now; nothing buffered so far is of use. The decoder
  // is configured again from that key frame: after a resize it has a new size, which Safari's decoder
  // otherwise silently discarded.
  function restart() {
    expected = null;
    configured = false;
    pending.clear();
    partial.clear();
    up("k");
  }

  function decodeOne(buffer) {
    const view = new DataView(buffer);
    const key = (view.getUint8(0) & 1) === 1;
    const timestamp = Number(view.getBigUint64(5));
    const data = new Uint8Array(buffer, HEADER);
    if (!configured) {
      if (!key) return;
      decoder.configure({codec: codecOf(data), optimizeForLatency: true, hardwareAcceleration: "prefer-hardware"});
      configured = true;
    }
    stats.maxQueue = Math.max(stats.maxQueue, decoder.decodeQueueSize);
    // Safari's decoder releases a frame only when the next one comes in, so a backlog never drains by
    // itself: flush what it holds and start over from a key frame.
    if (decoder.decodeQueueSize > 3 && !key) {
      stats.flushed++;
      decoder.flush().catch(() => {});
      restart();
      return;
    }
    queued.set(timestamp, performance.now());
    if (queued.size > 120) queued.clear();
    decoder.decode(new EncodedVideoChunk({type: key ? "key" : "delta", timestamp, data}));
  }

  // Decodes what is next in line; a frame missing too long is lost, so continue from a later key frame.
  function drain() {
    if (expected === null) {
      const keys = [...pending.keys()].filter((id) => isKey(pending.get(id)));
      if (!keys.length) return;
      // The newest key frame: older ones only show the past.
      expected = Math.max(...keys);
      for (const id of pending.keys()) if (id < expected) pending.delete(id);
    }
    while (expected !== null && pending.has(expected)) {
      const buffer = pending.get(expected);
      pending.delete(expected);
      expected++;
      gapSince = 0;
      decodeOne(buffer);
    }
    if (expected === null || !pending.size) return;
    // Waiting for a missing frame while a newer key frame is already here: no reason to wait.
    const newerKey = [...pending.keys()].some((id) => id > expected && isKey(pending.get(id)));
    if (newerKey) {
      stats.lost++;
      gapSince = 0;
      expected = null;
      drain();
      return;
    }
    const now = performance.now();
    if (!gapSince) {
      gapSince = now;
    } else if (now - gapSince > LOST_AFTER_MS) {
      stats.lost++;
      gapSince = 0;
      restart();
      drain();
    }
  }

  setInterval(drain, 20);
  setInterval(() => {
    up("s" + `decoded ${stats.decoded} fps · lost ${stats.lost} · flushed ${stats.flushed} · max queue ${stats.maxQueue} · ` +
      `slowest decode ${stats.decodeMs.toFixed(1)} ms · decoder errors ${stats.errors}`);
    Object.assign(stats, {decoded: 0, lost: 0, flushed: 0, maxQueue: 0, decodeMs: 0, errors: 0});
  }, 1000);

  onmessage = (e) => {
    if (e.data.canvas) {
      canvas = e.data.canvas;
      ctx = canvas.getContext("2d");
      newDecoder();
    } else if (e.data.restart) {
      // The Mac changed the picture size: start over from its next key frame.
      expected = null;
      configured = false;
      pending.clear();
      partial.clear();
    } else if (e.data.reset) {
      // A new connection: frame numbers start over.
      pending.clear();
      partial.clear();
      expected = null;
      shown = false;
      newDecoder();
    } else {
      const view = new DataView(e.data);
      const id = view.getUint32(1);
      if (expected !== null && id < expected) return; // Late: already past it.
      const piece = view.getUint16(13);
      const pieces = view.getUint16(15);
      let buffer = e.data;
      if (pieces > 1) {
        let p = partial.get(id);
        if (!p) {
          p = {parts: new Array(pieces), got: 0};
          partial.set(id, p);
        }
        if (!p.parts[piece]) {
          p.parts[piece] = new Uint8Array(e.data, HEADER);
          p.got++;
        }
        if (p.got < pieces) return;
        partial.delete(id);
        const size = p.parts.reduce((sum, part) => sum + part.length, 0);
        const whole = new Uint8Array(HEADER + size);
        whole.set(new Uint8Array(e.data, 0, HEADER));
        let at = HEADER;
        for (const part of p.parts) {
          whole.set(part, at);
          at += part.length;
        }
        buffer = whole.buffer;
      }
      // Pieces of frames already given up never complete.
      for (const old of partial.keys()) if (expected !== null && old < expected) partial.delete(old);
      pending.set(id, buffer);
      drain();
    }
  };
</script>

<script>
  const msg = document.getElementById("msg");
  const token = location.hash.slice(1);
  const VERSION = "__PAGE_VERSION__";
  let ws = null;
  let pc = null;
  let channel = null;
  let worker = null;

  function show(text) {
    msg.textContent = text;
    msg.classList.toggle("hidden", !text);
  }

  // Up to the Mac: over the data channel once it's open, else the WebSocket.
  function sendUp(text) {
    if (channel && channel.readyState === "open") {
      channel.send(text);
    } else if (ws && ws.readyState === WebSocket.OPEN) {
      ws.send(text);
    }
  }

  function onData(data) {
    if (typeof data === "string") {
      if (data[0] === "p") {
        sendUp("e" + data.slice(1));
      } else if (data[0] === "v") {
        // The Mac serves a newer page: load it.
        location.reload();
      } else if (data === "r") {
        worker.postMessage({restart: true});
      } else if (data[0] === "{") {
        const message = JSON.parse(data);
        if (message.answer) pc?.setRemoteDescription({type: "answer", sdp: message.answer});
      }
    } else {
      worker.postMessage(data, [data]);
    }
  }

  // Video over UDP: unordered, retried for at most 100 ms, so nothing waits behind a lost piece.
  async function startWebRtc() {
    if (!window.RTCPeerConnection) return;
    pc = new RTCPeerConnection();
    channel = pc.createDataChannel("video", {ordered: false, maxPacketLifeTime: 100});
    channel.binaryType = "arraybuffer";
    channel.onmessage = (e) => onData(e.data);
    await pc.setLocalDescription(await pc.createOffer());
    ws.send(JSON.stringify({offer: pc.localDescription.sdp}));
  }

  function connect() {
    ws = new WebSocket(`wss://${location.host}/ws`);
    ws.binaryType = "arraybuffer";
    ws.onopen = () => {
      // The screen in pixels, landscape: the Mac sends exactly that, so the picture isn't scaled again.
      // The visible area in device pixels: the Mac fits the picture into it.
      ws.send(JSON.stringify({token, version: VERSION, ...viewSize()}));
      show("Waiting for the picture…");
      startWebRtc().catch((e) => console.warn("WebRTC", e));
    };
    ws.onmessage = (e) => onData(e.data);
    ws.onclose = () => {
      show("Disconnected. Retrying…");
      pc?.close();
      pc = channel = null;
      worker.postMessage({reset: true});
      setTimeout(connect, 1000);
    };
  }

  // Keep the screen on while watching; the lock is released whenever the page is hidden.
  async function keepAwake() {
    try {
      await navigator.wakeLock?.request("screen");
    } catch (e) {
      console.warn(e);
    }
  }
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "visible") keepAwake();
  });

  // Fullscreen button: shown on a tap, fades after 3 s, hidden while in fullscreen. The browser only allows
  // fullscreen after a gesture.
  const full = document.getElementById("full");
  const inFullscreen = () => !!(document.fullscreenElement || document.webkitFullscreenElement);
  let idle = 0;
  function showButton() {
    full.classList.toggle("idle", inFullscreen());
    clearTimeout(idle);
    idle = setTimeout(() => full.classList.add("idle"), 3000);
  }
  full.addEventListener("click", (e) => {
    e.stopPropagation();
    keepAwake();
    // Safari on the iPhone allows fullscreen only for <video>; from the home screen the page has no bars.
    if (!document.fullscreenEnabled && !document.webkitFullscreenEnabled) {
      show("Fullscreen isn't available in this browser.\nShare → Add to Home Screen, then open it from there:\nit runs without the browser bars.");
      setTimeout(() => show(""), 5000);
      return;
    }
    const el = document.documentElement;
    (el.requestFullscreen || el.webkitRequestFullscreen)?.call(el);
  });
  document.addEventListener("click", () => {
    showButton();
    keepAwake();
  });
  showButton();

  // The view grows in fullscreen (no toolbars) or changes with rotation: let the Mac capture for the new
  // size, so the picture stays pixel for pixel.
  let resizing = 0;
  function viewSize() {
    const ratio = window.devicePixelRatio || 1;
    const area = document.getElementById("area");
    return {width: Math.round(area.clientWidth * ratio), height: Math.round(area.clientHeight * ratio)};
  }
  window.addEventListener("resize", () => {
    clearTimeout(resizing);
    resizing = setTimeout(() => {
      sendUp(JSON.stringify(viewSize()));
      showButton();
    }, 300);
  });

  const canvas = document.getElementById("screen");
  if (!canvas.transferControlToOffscreen || !("VideoDecoder" in window)) {
    show("This browser lacks WebCodecs or OffscreenCanvas.\nUse a current Safari, Chrome or Edge.");
  } else if (!token) {
    show("This link is missing its access code.\nOpen the full link the Mac shows.");
  } else {
    const source = document.getElementById("worker").textContent;
    worker = new Worker(URL.createObjectURL(new Blob([source], {type: "text/javascript"})));
    worker.onmessage = (e) => {
      if (e.data.up) sendUp(e.data.up);
      if (e.data.size) {
        // One picture pixel per device pixel.
        const ratio = window.devicePixelRatio || 1;
        canvas.style.width = `${e.data.size[0] / ratio}px`;
        canvas.style.height = `${e.data.size[1] / ratio}px`;
      }
      if (e.data.status !== undefined) show(e.data.status);
    };
    const offscreen = canvas.transferControlToOffscreen();
    worker.postMessage({canvas: offscreen}, [offscreen]);
    keepAwake();
    connect();
  }
</script>
</body>
</html>
