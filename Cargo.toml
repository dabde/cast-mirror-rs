[package]
name = "cast-mirror"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
bytes = "1.12.1"
chromiacast = { version = "0.3.1", features = ["discovery"] }
clap = { version = "4.6.7", features = ["derive"] }
env-libvpx-sys = { version = "5.1.3", optional = true, features = ["generate"] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSImage", "NSImageRep", "NSGraphicsContext", "NSFontDescriptor", "objc2-core-foundation", "objc2-core-graphics"] }
objc2-core-foundation = "0.3.2"
objc2-core-graphics = { version = "0.3.2", default-features = false, features = ["std", "CGBitmapContext", "CGColorSpace", "CGContext", "CGDirectDisplay", "CGError", "CGImage"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSString", "NSArray"] }
objc2-core-media = "0.3.2"
objc2-core-video = "0.3.2"
objc2-video-toolbox = "0.3.2"
opus = "0.4.0"
ring = "0.17.14"
rcgen = { version = "0.13", default-features = false, features = ["ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
base64 = "0.23"
screencapturekit = { version = "8", features = ["macos_14_0"] }
tao = "0.37.2"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "signal", "time", "sync", "process", "net", "io-util"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tray-icon = "0.26.1"
wry = "0.57"
png = "0.18"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
mdns-sd = "0.20"
str0m = { version = "0.24.1", default-features = false, features = ["rust-crypto"] }
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
objc2 = "0.6"

[features]
# Software VP8 fallback; needs libvpx (brew install libvpx).
vp8 = ["dep:env-libvpx-sys"]
# Hidden --unverified flag to test against openscreen's dev cast_receiver; never for real devices.
test-receiver = ["chromiacast/dangerous-unverified"]

# Chrome payload-type option and openscreen test vectors; see vendor/chromiacast/PATCHES.md.
[patch.crates-io]
chromiacast = { path = "vendor/chromiacast" }

[workspace]
members = [".", "vendor/chromiacast"]
