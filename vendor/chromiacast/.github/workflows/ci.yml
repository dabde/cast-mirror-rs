name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Stable Rust
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal --component clippy,rustfmt

      - name: Check formatting
        run: cargo +stable fmt --all --check

      - name: Run tests
        run: cargo +stable test --all-features --locked

      - name: Exercise minimal and independent feature surfaces
        run: |
          cargo +stable test --no-default-features --locked
          cargo +stable test --features android-tv --locked
          cargo +stable test --features discovery --locked
          cargo +stable test --features dangerous-unverified --locked

      - name: Check lints
        run: cargo +stable clippy --all-targets --all-features --locked -- -D warnings

      - name: Check documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: |
          cargo +stable doc --no-default-features --no-deps --locked
          cargo +stable doc --all-features --no-deps --locked

  msrv:
    name: Rust 1.83
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install the minimum supported Rust version
        run: rustup toolchain install 1.83.0 --profile minimal

      - name: Check the complete feature surface
        run: cargo +1.83.0 check --all-features --locked
